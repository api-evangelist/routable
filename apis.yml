name: Routable
kind: company
description: Routable is a B2B payments platform automating accounts payable and
  accounts receivable, mass payouts, and vendor management. Its API-first REST API
  lets teams onboard vendors and customers, collect payment and tax information,
  create payables and receivables, and move money via ACH, SWIFT, and check to more
  than 200 countries, with webhook events for end-to-end automation.
