  scope: account
  metric: requests
  limit: 600 per minute (default)
  notes: Default account-level request rate limit documented by Routable; exceeding it returns 429.
policies:
- name: Idempotency
  description: Use idempotency keys on create requests so retries after a 429 do not duplicate payments.
- name: Backoff Strategy
  description: Clients should implement exponential backoff with jitter on 429 responses.
