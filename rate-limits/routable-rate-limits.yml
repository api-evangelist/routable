description: >-
  The Routable v1 API enforces a default rate limit of 600 requests per minute
  per account. Requests beyond the limit are throttled. Idempotency keys are
  supported so create requests can be safely retried after backoff. Specific
  per-endpoint limits beyond the documented default are not reconciled in this
  artifact.
notes: >-
