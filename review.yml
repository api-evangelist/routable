aid: routable
name: Routable
review:
  question: Does Routable expose a documented public WebSocket API?
  answer: false
  date: '2026-06-21'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    Routable's only documented event delivery mechanism is outbound HTTP
    webhooks (webhook events queryable and retryable via the REST API). No
    WebSocket and no Server-Sent Events surface is documented, so no AsyncAPI
    document was authored. If webhook modeling is later brought into AsyncAPI
    scope, the webhook_events resource would be the channel to model.
findings:
  summary: |
    Routable does not publish a documented public WebSocket API. The Routable
    platform exposes a RESTful v1 HTTP API under https://api.routable.com/v1,
    using JSON over HTTPS and Bearer API-token authentication. Event-driven
    integration is delivered via outbound HTTP webhooks; webhook events can be
    listed, retrieved, and retried through REST endpoints. No realtime,
    bidirectional WebSocket (ws:// or wss://) endpoint is documented.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.routable.com/v1
      documented: true
    - protocol: Webhooks
      scheme: https
      note: Outbound HTTP webhook deliveries; events are queryable and retryable via REST (/webhook_events).
      documented: true
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in Routable's API reference as of the review date.
