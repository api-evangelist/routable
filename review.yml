sources:
  - url: https://developers.routable.com/reference/introduction
    type: APIReference
    note: Introduction describes a RESTful JSON-over-HTTPS API, Bearer token auth, and a 600 req/min default rate limit.
  - url: https://developers.routable.com/docs
    type: Documentation
    note: Developer portal; all documented endpoints are HTTPS REST. Events are delivered via outbound webhooks.
  - url: https://developers.routable.com/docs/webhooks
    type: Documentation
    note: Webhook events delivered over outbound HTTPS; queryable and retryable via REST, not WebSocket.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket or SSE protocol surface exists. Routable's eventing is
    outbound HTTP webhooks only, which is out of current AsyncAPI scope for
    this catalog, so no AsyncAPI document was created.
